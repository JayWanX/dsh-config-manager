mcp_servers:
  svc:
    command: npx
    args:
      - -y
      - fixture-svc
    env:
      GITHUB_TOKEN: ghp_FIXTURE_TOKEN_DO_NOT_SHIP
      PLAIN: ok
    enabled: true
  web:
    url: 'https://user:pw@mcp.example.com/mcp'
    headers:
      X-Trace: 'on'
  legacy-sse:
    url: https://sse.example.com/sse
    type: sse
  empty:
    note: 既无 command 也无 url —— 必须进 skipped，绝不产出空条目
