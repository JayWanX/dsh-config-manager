# 新 issue 自动打标签：按标题前缀 [Bug] / [Feature] / [UI] 兜底
#
# 为什么需要它：issue 模板里的 `labels: bug` 只在「用户从网页选模板创建」时生效。
# 走 API / gh CLI / Agent 创建的 issue 会绕过模板，于是出现标题带 [Bug] 却没有任何标签的 issue
# （例：#38 / #35 / #31 / #30 / #29 / #27 就是这样来的）。
#
# 规则（只看标题开头的 [...] 前缀段，大小写不敏感，不解析正文）：
#   [Bug] / [BUG] / [bug]  -> bug
#   [Feature] / [FEATURE]  -> enhancement
#   [UI] / [ui]            -> ui + bug（界面问题本质上就是一个 bug，只是多一条分类标签）
#   [Feature] [Bug] xxx    -> enhancement + bug（双前缀标题两个都打）
# 标题中后段出现的 [Bug] 不算（必须是开头）；重复标签会自动去重。
#
# 触发事件：opened / edited（仅标题变更）/ reopened —— 标题在创建之后才补上前缀同样会重新判定
# （#61：作者关闭后把标题改成 [Feature] … 再重开，旧版只听 opened，于是漏打 enhancement）。
#
# 前置条件：这里用到的 bug / enhancement / ui 标签必须已存在于仓库，否则 GitHub 静默忽略。
name: Auto label issues

on:
  issues:
    types: [opened, edited, reopened]

# 最小权限：标签属于 issue 资源，只需要 issues: write（不碰代码，不申请仓库写权限）
permissions:
  issues: write

jobs:
  label:
    name: Label by title prefix
    # edited 只在「标题确实变了」时跑：补正文（贴截图/日志）是高频操作，不该触发打标
    # opened / reopened 没有 changes 字段，用 action 判断放行
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add labels from title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          title_lower=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]')
          # 只取标题开头连续的 [xxx] 前缀段；标题中后段的 [Bug] 不算
          head_part=$(printf '%s' "$title_lower" | grep -oE '^[[:space:]]*(\[[^]]+\][[:space:]]*)+' || true)

          # 用空格分隔的字符串累积并去重：标题 [UI][Bug] 不会重复打两次 bug
          labels=""
          add_label() {
            case " $labels " in *" $1 "*) ;; *) labels="$labels $1" ;; esac
          }
          if [[ "$head_part" == *"[bug]"* ]]; then add_label bug; fi
          if [[ "$head_part" == *"[feature]"* ]]; then add_label enhancement; fi
          if [[ "$head_part" == *"[ui]"* ]]; then add_label ui; add_label bug; fi

          if [ -z "${labels// /}" ]; then
            # notice 而不是普通 echo：让「该打标却跳过」出现在运行摘要里，不再是静默绿
            echo "::notice::标题开头没有 [Bug]/[Feature]/[UI] 前缀，已跳过打标：$ISSUE_TITLE"
            exit 0
          fi

          for label in $labels; do
            echo "-> #$ISSUE_NUMBER 添加标签：$label"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$label"
          done
